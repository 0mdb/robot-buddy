[package]
name = "reflex-g431"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reflex MCU firmware on the STM32G431 (port of esp32-reflex): NUCLEO-G431RB bench or the reflex v3 board"

[features]
default = ["board-nucleo"]
# NUCLEO-G431RB bench: host link on the ST-LINK VCP (USART2), pins remapped around it.
board-nucleo = ["embassy-stm32/stm32g431rb"]
# Reflex v3 board (STM32G431CBU6): host link on USART1 to the Pi. Pins: ~/kicad-libs/docs/g431-pin-plan.md
board-v3 = ["embassy-stm32/stm32g431cb"]
# Bench without an IMU: do not raise IMU_FAIL (which would gate the motors).
no-imu-fault = []

[dependencies]
embassy-stm32 = { version = "0.6", features = ["defmt", "time-driver-any", "memory-x", "unstable-pac", "exti"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embedded-io-async = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
reflex-core = { path = "../reflex-core", features = ["defmt"] }

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "s"

[profile.dev]
opt-level = 1
