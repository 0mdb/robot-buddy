[project]
name = "robot-buddy-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
sim = ["pygame>=2.5"]
cad = ["trimesh>=4.4", "numpy>=1.26", "scipy>=1.11", "rtree>=1.2"]

[project.scripts]
robot-serial-diag = "serial_diag:main"
